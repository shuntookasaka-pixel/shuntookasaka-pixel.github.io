<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>shuntookasaka-pixelの部屋</title>
    <!-- CSSファイルを読み込む -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 style="color: #4ba3ff; text-align: center; font-size: 3rem; margin-bottom: 10px;">shuntookasaka-pixelの部屋</h1>
    
    <h2>自己紹介</h2>
    <p>私は小学生で、なんかいろいろプログラミングなどします。<br>そしてしたに作ったアプリなどを公開します。<br>えーよろしくお願いいたします。</p>
    <p style="color: gray; font-family: 'Segoe UI', sans-serif;">挨拶苦手すぎる</p>

    <!-- カードセクション -->
    <div class="card-container">
        <div class="card">
            <p>作ったものなどはこちら</p>
            <!-- value="クリック" に修正し、後でクリックできるように id を追加 -->
            <input type="button" value="クリック" id="btn-projects"/>
        </div>

        <div class="card">
            <p>その他ブログなどはこちら</p>
            <input type="button" value="クリック" id="btn-blog"/>
        </div>
    </div>

    <!-- Go Top 画像の配置 -->
    <div style="text-align: center; margin-top: 40px;">
        <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 5px;">クリックすると一番上に戻るよ！</p>
        <img src="Go Top!.png" alt="Go Top" id="goTopBtn" class="go-top-img">
    </div>

    <p style="margin-top: 50px; font-size: 0.9rem; color: #8b949e; text-align: center;">Powered by GitHub Pages</p>

    <!-- JavaScriptファイルを読み込む -->
    <script src="script.js"></script>
</body>
</html>
